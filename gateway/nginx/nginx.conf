events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging Configuration
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Upstreams for microservices
    upstream auth_service {
        server auth-service:8001;
        keepalive 32;
    }

    # Placeholders for future services
    upstream venue_service {
        server venue-service:8002;
    }

    upstream booking_service {
        server booking-service:8003;
    }

    upstream notification_service {
        server notification-service:8004;
    }

    upstream ai_service {
        server ai-service:8005;
    }

    # API Gateway Server Configuration
    server {
        listen 8080;
        server_name localhost;

        client_max_body_size 10M;

        # Rate limiting applied globally to API requests
        limit_req zone=api_limit burst=20 nodelay;

        # Public Routes redirect to frontend or display default status page
        location / {
            return 200 '{"status":"running","gateway":"nginx-api-gateway"}';
            add_header Content-Type application/json;
        }

        # ----------------------------------------------------
        # SECURITY RULE: Block all external access to internal APIs
        # ----------------------------------------------------
        location ~ ^/internal/ {
            deny all;
            return 403 '{"success":false,"message":"Access forbidden."}';
            add_header Content-Type application/json;
        }

        # ----------------------------------------------------
        # ROUTING: Microservices API Gateway Routing
        # ----------------------------------------------------

        # 1. Auth Service
        location /api/auth/ {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Venue Service (placeholder)
        location /api/venues/ {
            proxy_pass http://venue_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Booking Service (placeholder)
        location /api/bookings/ {
            proxy_pass http://booking_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Notification Service (placeholder)
        location /api/notifications/ {
            proxy_pass http://notification_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. AI Service (placeholder)
        location /api/ai/ {
            proxy_pass http://ai_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 6. Global Health Check
        location /health/ {
            proxy_pass http://auth_service/health/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
