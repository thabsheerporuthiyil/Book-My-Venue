[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Auto-discover tests in the tests/ directory
testpaths = tests

# Show verbose output with short tracebacks
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header

# Custom markers for selective test runs
markers =
    unit: Unit tests (service layer, pure logic)
    integration: Integration tests (API endpoints, HTTP contracts)
    security: Security tests (tenant isolation, cross-tenant access denial)
