# ==========================================
# Shared Configurations (DRY)
# ==========================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

x-auth-env: &auth-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  REDIS_URL: redis://redis:6379/0
  ALLOWED_HOSTS: auth-service,localhost,127.0.0.1,gateway
  CORS_ALLOWED_ORIGINS: http://localhost:3000

x-venue-env: &venue-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  REDIS_URL: redis://redis:6379/0
  ALLOWED_HOSTS: venue-service,localhost,127.0.0.1,gateway
  CORS_ALLOWED_ORIGINS: http://localhost:3000

services:
  # ==========================================
  # Nginx API Gateway
  # ==========================================
  gateway:
    build:
      context: ./gateway/nginx
      dockerfile: Dockerfile
    container_name: bmv-gateway
    profiles: ["infra"]
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
    logging: *default-logging
    networks:
      - bmv-network
    restart: unless-stopped

  # ==========================================
  # Auth Microservice (Django/DRF)
  # ==========================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: bmv-auth-service
    profiles: ["auth"]
    env_file:
      - ./services/auth-service/.env
    environment:
      <<: *auth-env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - bmv-network
    restart: unless-stopped

  # ==========================================
  # Venue Microservice (Django/DRF)
  # ==========================================
  venue-service:
    build:
      context: .
      dockerfile: ./services/venue-service/Dockerfile
    container_name: bmv-venue-service
    profiles: ["venue"]
    env_file:
      - ./services/venue-service/.env
    environment:
      <<: *venue-env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - venue_static_volume:/app/staticfiles
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - bmv-network
    restart: unless-stopped

  # ==========================================
  # Auth Service Background Worker (Celery)
  # ==========================================
  auth-service-celery:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: bmv-auth-service-celery
    profiles: ["workers"]
    command: celery -A config worker --loglevel=info
    env_file:
      - ./services/auth-service/.env
    environment:
      <<: *auth-env
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - bmv-network
    restart: unless-stopped

  # ==========================================
  # Venue Service Background Worker (Celery)
  # ==========================================
  venue-service-celery:
    build:
      context: .
      dockerfile: ./services/venue-service/Dockerfile
    container_name: bmv-venue-service-celery
    profiles: ["workers"]
    command: celery -A config worker --loglevel=info
    env_file:
      - ./services/venue-service/.env
    environment:
      <<: *venue-env
    depends_on:
      redis:
        condition: service_healthy
      venue-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - bmv-network
    restart: unless-stopped
  # ==========================================
  # Redis Cache & Message Broker
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: bmv-redis
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - bmv-network
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  static_volume:
    driver: local
  venue_static_volume:
    driver: local

networks:
  bmv-network:
    name: bmv-network
    driver: bridge
