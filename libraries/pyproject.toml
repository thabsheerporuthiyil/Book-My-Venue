[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmyvenue-platform"
version = "0.1.0"
description = "Shared platform library for Book My Venue microservices"
authors = [
    {name = "Book My Venue Engineering"}
]
dependencies = [
    "pydantic>=2.0.0",
    "django>=4.2.0",  # Needed for AbstractOutboxModel and Middleware
]

[project.optional-dependencies]
kafka = [
    "confluent-kafka>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bmv_libraries*"]
