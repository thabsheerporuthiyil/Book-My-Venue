[tool.ruff]
# Set the maximum line length to 120 characters (standard for this project)
line-length = 120
# Assume Python 3.12
target-version = "py312"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pypackages__",
    "build",
    "dist",
    "migrations", # Don't lint Django migrations!
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (automatically sorts imports!)
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "DJ", # flake8-django (catches Django-specific bad practices)
]
ignore = [
    "E501", # line too long, handled by formatter
]

# Allow autofix for all enabled rules (when `--fix` is provided).
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
# Ignore 'imported but unused' in barrel files
"__init__.py" = ["F401"]
# Ignore 'unable to detect undefined names' for proxy models
"apps/*/models.py" = ["F403"]
# Ignore 'unable to detect undefined names' for split settings
"config/settings/*.py" = ["F403", "F405"]

[tool.uv.workspace]
members = ["services/*", "libraries/*"]
